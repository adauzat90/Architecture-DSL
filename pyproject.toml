[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barndsl"
version = "1.0.0"
description = "An embedded Python DSL and agentic workflow for designing barndominium floor plans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Architecture-DSL" }]
keywords = ["dsl", "floor-plan", "barndominium", "architecture", "agent", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Compilers",
]

# The engine — compiler, validation, SVG/DXF/IFC/glTF exports, schedules, cost,
# playground, LSP, fmt — is dependency-free by design (stdlib only). Everything
# else is opt-in via extras.
dependencies = []

[project.optional-dependencies]
# The pure engine (DSL + validation + rendering) needs no extras.
# The agentic workflow needs the Anthropic SDK, pydantic (its structured briefs),
# and python-dotenv (`barndsl design`/`serve` pick up a local .env; the CLI
# soft-imports dotenv and no-ops without it).
agent = ["anthropic>=0.49", "pydantic>=2.6", "python-dotenv>=1.0"]
# PNG/PDF rendering (SVG works with no extras).
raster = ["cairosvg>=2.7"]
# IFC export needs NO dependency (ifc.py hand-writes STEP/SPF). This extra is only
# the optional test-time validation oracle that `tests/test_ifc.py` uses when
# present — it is never imported at runtime.
ifc-validate = ["ifcopenshell>=0.7"]
dev = [
    "pytest>=8.0",
    # The agent-loop tests import barndsl.agent, which needs the agent extra's
    # libraries even when the tests stub the API calls.
    "anthropic>=0.49",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
barndsl = "barndsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the `tools` package (it lives
# at the root, not under src/, so it isn't installed). Without this, the bare
# `pytest` console script CI uses can't import it (only `python -m pytest` would).
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Pyflakes (F) catches real defects — unused imports, undefined names, dead
# bindings — and is the primary reason this gate exists. The pycodestyle (E/W)
# rules cover obvious style slips. We deliberately leave a couple of pervasive,
# low-value rules off rather than churn the geometry code:
#   E741  "ambiguous variable name" — `l` reads as *length* throughout the
#         coordinate math (x, y, w, l), a domain convention, not a hazard.
#   E731  "lambda assignment" — used locally as small, named comparators.
#   E501  "line too long" — the DSL reference tables (docstrings) and the
#         embedded HTML/CSS/JS in tools/design_review.py are intentionally wide;
#         reflowing them hurts readability for no real gain.
select = ["F", "E", "W"]
ignore = ["E741", "E731", "E501"]

[tool.mypy]
# The codebase is fully annotated and type-clean: the former ~130-error backlog
# (loop-variable union collisions, optional-field narrowing, mixed-opening
# iteration) has been paid down, so CI now gates on mypy. Keep it green; the next
# step is to ratchet `strict`-ness up one flag at a time.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/barndsl"]
